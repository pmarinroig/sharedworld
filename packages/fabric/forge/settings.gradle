// Build project for the Forge 1.20.1 port (0.5.4). It shares the source tree of
// the classic project one directory up; only the loader shims and toolchain
// differ (ModDevGradle legacyforge, no loom; MinecraftForge 1.20.1 runs
// official Mojang mappings in dev, reobfuscated to SRG for production).
pluginManagement {
    repositories {
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases"
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "sharedworld-mod-forge"
