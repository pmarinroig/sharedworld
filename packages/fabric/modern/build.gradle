plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Buckets for the unobfuscated Minecraft generation; same idea as the classic project,
// but built without mappings or remapping. Select with -PsharedworldMcBucket=,
// defaulting per buckets.json — the single source of truth shared with the classic
// project and the workspace verify scripts.
def bucketConfig = new groovy.json.JsonSlurper().parse(file("../buckets.json"))
def mcBuckets = bucketConfig.buckets.findAll { it.project == "modern" }.collectEntries {
    [(it.name): it]
}
def mcBucketName = providers.gradleProperty("sharedworldMcBucket").getOrElse(bucketConfig.defaults.modern)
def mcBucket = mcBuckets[mcBucketName]
if (mcBucket == null) {
    throw new GradleException("Unknown sharedworldMcBucket '${mcBucketName}'. Known buckets: ${mcBuckets.keySet()}")
}

// Compatibility probing, mirroring the classic project: override the bucket's
// Minecraft/fabric-api pair (e.g. to materialize another 26.1.x jar for the
// mixin-target audit) without touching the bucket map:
//   ./gradlew help -PsharedworldProbeMinecraft=26.1.1
def probeMinecraft = providers.gradleProperty("sharedworldProbeMinecraft")
def probeFabricApi = providers.gradleProperty("sharedworldProbeFabricApi")
if (probeMinecraft.isPresent()) {
    mcBucket = new LinkedHashMap(mcBucket)
    mcBucket.minecraftVersion = probeMinecraft.get()
    mcBucket.fabricApiVersion = probeFabricApi.getOrElse(mcBucket.fabricApiVersion)
}
def fakeRunLocalBackendUrl = "http://127.0.0.1:8787"
def fakeRunDevAuthSecretProvider = providers.gradleProperty("sharedworldDevAuthSecret")
        .orElse(providers.environmentVariable("SHAREDWORLD_DEV_AUTH_SECRET"))
def fakeRunDevAuthSecret = fakeRunDevAuthSecretProvider.orNull
def localModsDir = file("local/mods")

// The 26.1 generation renamed the GUI render layer wholesale ("render" became a
// state-extraction pass) but kept every shape SharedWorld uses. Rather than fork the GUI
// sources, the shared tree is copied at build time with these systematic renames applied.
// Each rule is a plain rename of the same logical API; anything structural belongs in
// src/versioned/<bucket>/ instead.
def modernRenames = [
        [/\bGuiGraphics\b/, "GuiGraphicsExtractor"],
        [/\brenderContent\(/, "extractContent("],
        [/void render\(GuiGraphicsExtractor/, "void extractRenderState(GuiGraphicsExtractor"],
        [/\.render\(/, ".extractRenderState("],
        [/renderBackground\(/, "extractBackground("],
        [/\bDimensionDataStorage\b(?!Accessor)/, "SavedDataStorage"],
        [/tabNavigationBar\.setWidth\(/, "tabNavigationBar.updateWidth("],
        [/\.drawString\(/, ".text("],
        [/\.drawCenteredString\(/, ".centeredText("],
        [/\.hLine\(/, ".horizontalLine("],
        [/\.vLine\(/, ".verticalLine("],
        [/renderMenuBackgroundTexture\(/, "extractMenuBackgroundTexture("],
        [/renderMenuBackground\(/, "extractMenuBackground("],
        [/renderPanorama\(/, "extractPanorama("],
        [/renderBlurredBackground\(/, "extractBlurredBackground("],
]

def prepareSharedSources = tasks.register("prepareSharedSources", Sync) {
    inputs.property "modernRenames", modernRenames.collect { it.join(" -> ") }.join("\n")
    from "../src/main/java"
    into layout.buildDirectory.dir("generated/sharedMain")
    filter { String line ->
        String result = line
        modernRenames.each { rule -> result = result.replaceAll(rule[0], rule[1]) }
        result
    }
}

// The dev helper (login bypass) also builds per modern bucket so the manual
// two-client playtest works on 26.x with the fake HostA/GuestB accounts, same
// as on the classic buckets. Today's dev-helper sources contain no GUI tokens,
// so the rename filter is a no-op kept for symmetry with the main tree.
def skipDevHelperRuntime = providers.gradleProperty("sharedworldSkipDevHelperRuntime")
        .map { it.toBoolean() }.orElse(false)

def prepareSharedDevHelperSources = tasks.register("prepareSharedDevHelperSources", Sync) {
    inputs.property "modernRenames", modernRenames.collect { it.join(" -> ") }.join("\n")
    from "../src/devhelper/java"
    into layout.buildDirectory.dir("generated/sharedDevHelper")
    filter { String line ->
        String result = line
        modernRenames.each { rule -> result = result.replaceAll(rule[0], rule[1]) }
        result
    }
}

sourceSets {
    main {
        java.srcDirs = [prepareSharedSources, "../src/versioned/${mcBucketName}/java"] \
                + (mcBucket.sharedVersionedDirs ?: []).collect { "../src/versioned/common/${it}/java" }
        resources.srcDirs = ["../src/main/resources", "../src/versioned/${mcBucketName}/resources"]
    }
    test {
        java.srcDirs = ["../src/test/java", "../src/versionedTest/${mcBucketName}/java"] \
                + (mcBucket.sharedVersionedTestDirs ?: []).collect { "../src/versionedTest/common/${it}/java" }
        resources.srcDirs = ["../src/test/resources"]
    }
    devHelper {
        java.srcDirs = [prepareSharedDevHelperSources, "../src/devhelperVersioned/${mcBucketName}/java"]
        resources.srcDirs = ["../src/devhelper/resources"]
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

def devHelperJarTask = tasks.register("devHelperJar", Jar) {
    archiveClassifier = "dev-helper"
    // Per-bucket file name, matching the classic project: a stale jar from
    // another bucket must never end up in a run's mod set.
    archiveVersion = "${project.mod_version}+mc${mcBucketName}"
    from sourceSets.devHelper.output
}

repositories {
    maven {
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${mcBucket.minecraftVersion}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${mcBucket.fabricApiVersion}"
    compileOnly "org.jspecify:jspecify:1.0.0"
    if (localModsDir.exists()) {
        runtimeOnly(fileTree(localModsDir).matching {
            include "*.jar"
            exclude "fabric-api-*.jar"
        })
    }
    // The loader discovers classpath jars carrying a fabric.mod.json in dev runs
    // (same mechanism as the local e4mc jar above), so the login bypass mixin is
    // present when HostA/GuestB connect through e4mc.
    if (!skipDevHelperRuntime.get()) {
        runtimeOnly(files(devHelperJarTask))
    }
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
    mods {
        sharedworld {
            sourceSet sourceSets.main
        }
    }
    runs {
        fakeHost {
            inherit client
            configName = "SharedWorld ${mcBucketName} Fake Host"
            runDir = "run-host"
            def hostName = "HostA"
            def hostUuid = "11111111-1111-1111-1111-111111111111"
            vmArgs "-Dsharedworld.backendUrl=${fakeRunLocalBackendUrl}"
            vmArgs "-Dsharedworld.devPlayerName=${hostName}"
            vmArgs "-Dsharedworld.devPlayerUuid=${hostUuid}"
            if (fakeRunDevAuthSecret != null) {
                vmArgs "-Dsharedworld.devAuthSecret=${fakeRunDevAuthSecret}"
            }
            programArg "--username=${hostName}"
            programArg "--uuid=${hostUuid}"
        }
        fakeGuest {
            inherit client
            configName = "SharedWorld ${mcBucketName} Fake Guest"
            runDir = "run-guest"
            def guestName = "GuestB"
            def guestUuid = "22222222-2222-2222-2222-222222222222"
            vmArgs "-Dsharedworld.backendUrl=${fakeRunLocalBackendUrl}"
            vmArgs "-Dsharedworld.devPlayerName=${guestName}"
            vmArgs "-Dsharedworld.devPlayerUuid=${guestUuid}"
            if (fakeRunDevAuthSecret != null) {
                vmArgs "-Dsharedworld.devAuthSecret=${fakeRunDevAuthSecret}"
            }
            programArg "--username=${guestName}"
            programArg "--uuid=${guestUuid}"
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name in ["runFakeHost", "runFakeGuest"] } && !fakeRunDevAuthSecretProvider.isPresent()) {
        throw new GradleException(
                "Fake SharedWorld runs require a dev auth secret. Set DEV_AUTH_SECRET in " +
                        "packages/backend/.dev.vars and pass it with -PsharedworldDevAuthSecret=..., " +
                        "or pass -PsharedworldDevAuthSecret=... explicitly."
        )
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraftRange", mcBucket.minecraftRange
    inputs.property "javaVersion", "25"

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version, "minecraftRange": inputs.properties.minecraftRange, "javaVersion": inputs.properties.javaVersion
    }
    // Keep the level the 26.1 jar has always shipped with (mixin treats it as
    // a minimum; newer class versions are tolerated).
    filesMatching("sharedworld.mixins.json") {
        expand "mixinCompatibilityLevel": "JAVA_21"
    }
}

tasks.named("processDevHelperResources").configure {
    inputs.property "version", project.version
    inputs.property "minecraftRange", mcBucket.minecraftRange
    inputs.property "javaVersion", "25"

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version, "minecraftRange": inputs.properties.minecraftRange, "javaVersion": inputs.properties.javaVersion
    }
    filesMatching("sharedworld-dev-helper.mixins.json") {
        expand "mixinCompatibilityLevel": "JAVA_21"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

tasks.named("jar").configure {
    archiveVersion = "${project.mod_version}+mc${mcBucketName}"
}

tasks.named("test").configure {
    useJUnitPlatform {
        excludeTags "integration"
    }
    // Private tmpdir per test JVM: the temp-leak tests snapshot
    // java.io.tmpdir for sharedworld-* entries, and the release gate runs
    // the classic and modern lanes' test JVMs concurrently — a shared OS
    // tmpdir makes those snapshots race the other lane's temp churn.
    def testTmpDir = layout.buildDirectory.dir("test-tmpdir").get().asFile
    doFirst { testTmpDir.mkdirs() }
    systemProperty "java.io.tmpdir", testTmpDir.absolutePath
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
