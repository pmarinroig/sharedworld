name = "sharedworld"
main = "src/index.ts"
compatibility_date = "2026-03-28"

[[d1_databases]]
binding = "DB"
database_name = "sharedworld"
database_id = "9375862a-5ace-47ec-8e2f-5b1bad12cf34"

#[[r2_buckets]]  Currently not using R2
#binding = "BLOBS"
#bucket_name = "sharedworld-blobs"

# Persist console logs as queryable Workers Logs — without this, the auth
# path's Mojang-status warnings only exist inside a live `wrangler tail`.
[observability]
enabled = true

[vars]
ALLOW_DEV_AUTH = "false"
ALLOW_DEV_INSECURE_E4MC = "false"
ALLOW_DEV_GOOGLE_OAUTH = "false"

ACTIVE_STORAGE_PROVIDER = "google-drive"
GOOGLE_OAUTH_SCOPES = "openid email profile https://www.googleapis.com/auth/drive.appdata"
PUBLIC_BASE_URL = "https://sharedworld.farigola777.workers.dev"
GOOGLE_OAUTH_REDIRECT_URI = "https://sharedworld.farigola777.workers.dev/storage/google/callback"

SESSION_TTL_HOURS = "168"
SIGNED_URL_TTL_SECONDS = "900"

# Largest single blob body the worker relay accepts (advertised to clients via
# SyncPolicy.maxUploadBodyBytes). Must stay under the Cloudflare plan's
# request-body limit — 100 MB on workers.dev — or the edge 413s first.
UPLOAD_MAX_BODY_BYTES = "95000000"

# Growth valve: hard ceiling on total non-deleted worlds. Generous on purpose
# (beta has a handful); exists so unexpected virality queues politely instead
# of becoming an unbounded D1/Workers bill. Raise via config-only deploy.
MAX_ACTIVE_WORLDS = "1000"

MOJANG_HAS_JOINED_ENDPOINT = "https://sessionserver.mojang.com/session/minecraft/hasJoined"

# 0.3.0 realtime: per-world runtime coordinators + per-player WebSocket
# gateways (see docs/realtime.md in the workspace repo).
[[durable_objects.bindings]]
name = "WORLD_COORDINATOR"
class_name = "WorldCoordinatorDO"

[[durable_objects.bindings]]
name = "USER_GATEWAY"
class_name = "UserGatewayDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorldCoordinatorDO", "UserGatewayDO"]
