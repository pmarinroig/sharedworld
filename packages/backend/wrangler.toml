name = "sharedworld"
main = "src/index.ts"
compatibility_date = "2026-03-28"

# Persist console logs as queryable Workers Logs; without this, warnings
# only exist inside a live `wrangler tail`.
[observability]
enabled = true

# The worker is only the lane-D front for the Rust server: forwards
# legacy-client HTTP + WebSocket traffic to BOX_URL and relays blob downloads
# from Google Drive. Secrets (wrangler secret put): INTERNAL_API_SECRET,
# RELAY_PUBLIC_KEY, RELAY_TOKEN_KEY (from `swctl relay-keys-gen`).
# The D1 database "sharedworld" still exists in Cloudflare, unbound, as a cold
# pre-cutover snapshot; delete it from the dashboard around 2026-09-19.
[vars]
MODE = "lane-d"
BOX_URL = "https://api.763616.xyz"

# The 0.3.0 Durable Object era, retired with the 2026-08-19 cutover to the
# box. Migration tags are append-only history: v1 created the classes, v2
# deleted them (and their storage) after the state was imported into the box.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorldCoordinatorDO", "UserGatewayDO"]

[[migrations]]
tag = "v2"
deleted_classes = ["WorldCoordinatorDO", "UserGatewayDO"]
