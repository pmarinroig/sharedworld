[package]
name = "swedge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "http2"] }
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
parking_lot = "0.12.5"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-acme = { version = "0.15.4", default-features = false, features = ["ring", "tls12", "webpki-roots", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sw-ipc = { version = "0.1.0", path = "../sw-ipc" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", features = ["codec", "compat"] }
toml = "1.1.4"
tower = { version = "0.5.3", features = ["util"] }
tower-service = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
