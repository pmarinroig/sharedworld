[package]
name = "sw-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.11.0"
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
dashmap = "6.2.1"
ed25519-dalek = "3.0.0"
futures = "0.3.34"
hmac = "0.13.0"
http = "1.5.0"
metrics = "0.24.6"
moka = { version = "0.12.16", features = ["future"] }
parking_lot = "0.12.5"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "json", "http2", "gzip"] }
ring = "0.17.14"
rsa = { version = "0.9.10", features = ["sha1", "sha2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.11.0"
smallvec = "1.15.2"
sw-contracts = { version = "0.1.0", path = "../sw-contracts" }
sw-db = { version = "0.1.0", path = "../sw-db" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
axum = "0.8.9"
chrono = "0.4.45"
sw-testkit = { path = "../sw-testkit" }
tempfile = "3.27.0"

[lints]
workspace = true
