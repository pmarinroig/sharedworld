[package]
name = "sw-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.11.0"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.16"
include_dir = "0.7.4"
metrics = "0.24.6"
parking_lot = "0.12.5"
rand = "0.10.2"
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "backup"] }
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
sw-contracts = { version = "0.1.0", path = "../sw-contracts" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "sync", "macros", "time", "rt-multi-thread"] }
tracing = "0.1.44"
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
chrono = "0.4.45"
tempfile = "3.27.0"

[lints]
workspace = true
