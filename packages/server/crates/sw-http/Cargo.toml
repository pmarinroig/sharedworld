[package]
name = "sw-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
testkit = []

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "macros", "http2"] }
bytes = "1.12.1"
futures = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = "1.11.0"
hyper-util = "0.1.20"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream"] }
serde = "1.0.229"
serde_json = "1.0.151"
sw-contracts = { version = "0.1.0", path = "../sw-contracts" }
sw-core = { version = "0.1.0", path = "../sw-core" }
sw-db = { version = "0.1.0", path = "../sw-db" }
sw-ipc = { version = "0.1.0", path = "../sw-ipc" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec", "io"] }
tower = "0.5.3"
tower-http = "0.7.0"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
regex = "1"
walkdir = "2"
futures-util = "0.3.34"
tokio-tungstenite = "0.30.0"
uuid = { version = "1.24.1", features = ["v4"] }
