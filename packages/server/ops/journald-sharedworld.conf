# /etc/systemd/journald.conf.d/sharedworld.conf — bound the journal so logs can
# never eat the disk: 500 MB cap, one month, compressed. Both services log JSON
# lines at info (errors + job summaries; no per-request access log).
[Journal]
SystemMaxUse=500M
SystemKeepFree=1G
MaxRetentionSec=1month
Compress=yes
