# Optional local observability stack on the box (loopback only; reach via
# ssh -L 3000:127.0.0.1:3000 box). `docker compose up -d` in this directory.
services:
  prometheus:
    image: prom/prometheus:latest
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.listen-address=127.0.0.1:9090", "--storage.tsdb.retention.time=30d"]
  grafana:
    image: grafana/grafana:latest
    network_mode: host
    environment:
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
volumes:
  prom-data:
  grafana-data:
